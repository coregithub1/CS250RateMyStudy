name: Frontend requirements
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check REQ-1 and REQ-3
        run: npm test
      - name: Verify GitHub Pages static build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /CS250RateMyStudy
